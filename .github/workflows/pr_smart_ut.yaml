name: PR Smart UT

on:
  pull_request:
    branches:
      - 'main'
      # - '*-dev'
      - 'releases/v*'
    paths:
      - '.github/vllm-hust-pyramidkv.commit'
      - '.github/workflows/pr_smart_ut.yaml'
      - '.github/workflows/_selected_tests.yaml'
      - '.github/workflows/scripts/select_tests.py'
      - '.github/workflows/scripts/runner_label.json'
      - '.github/workflows/scripts/test_config.yaml'
      - 'packages.txt'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - 'requirements.txt'
      - 'setup.py'
      - 'tests/ut/**'
      - 'vllm_ascend/**'

defaults:
  run:
    shell: bash -el {0}

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine smart UT scope
    runs-on: ubuntu-latest
    outputs:
      has_tests: ${{ steps.cpu_scope.outputs.has_tests || steps.noop.outputs.has_tests }}
      test_groups: ${{ steps.cpu_scope.outputs.test_groups || steps.noop.outputs.test_groups }}
      matched_modules: ${{ steps.scope.outputs.matched_modules || steps.noop.outputs.matched_modules }}
      main_commit: ${{ steps.vllm.outputs.main_commit }}
      pyramidkv_core_commit: ${{ steps.vllm.outputs.pyramidkv_core_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read verified vLLM commits
        id: vllm
        run: |
          main_commit="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          pyramidkv_core_commit="$(tr -d '[:space:]' < .github/vllm-hust-pyramidkv.commit)"
          if [[ ! "${main_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=.github/vllm-main-verified.commit::expected one full lowercase commit ID"
            exit 1
          fi
          if [[ ! "${pyramidkv_core_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=.github/vllm-hust-pyramidkv.commit::expected one full lowercase commit ID"
            exit 1
          fi
          {
            echo "main_commit=${main_commit}"
            echo "pyramidkv_core_commit=${pyramidkv_core_commit}"
          } >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            smart_ut:
              - 'packages.txt'
              - 'pyproject.toml'
              - 'requirements-dev.txt'
              - 'requirements.txt'
              - 'setup.py'
              - 'tests/ut/**'
              - 'vllm_ascend/**'

      - name: Determine smart UT test scope
        id: scope
        if: steps.filter.outputs.smart_ut == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin "${{ github.base_ref }}"
          python3 -m pip install pyyaml regex
          python3 .github/workflows/scripts/select_tests.py \
            --diff-base "origin/${{ github.base_ref }}" \
            --cpu-only

      - name: Set no-tests output when smart UT paths unchanged
        id: noop
        if: steps.filter.outputs.smart_ut != 'true'
        run: |
          echo "Smart UT matrix skipped: no runtime or unit-test paths changed."
          {
            echo "has_tests=false"
            echo "test_groups=[]"
            echo "matched_modules=workflow-only"
          } >> "$GITHUB_OUTPUT"

      - name: Restrict PR smart UT to hosted CPU tests
        id: cpu_scope
        if: steps.scope.outputs.has_tests == 'true'
        env:
          TEST_GROUPS: ${{ steps.scope.outputs.test_groups }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          groups = json.loads(os.environ["TEST_GROUPS"])
          cpu_groups = []
          for group in groups:
              if group.get("npu_type") != "cpu":
                  continue
              hosted_group = dict(group)
              hosted_group["runner"] = "ubuntu-latest"
              hosted_group["image_tag"] = "22.04"
              hosted_group["hosted_cpu"] = True
              cpu_groups.append(hosted_group)
          print(
              "PR Smart UT CPU-only groups:",
              json.dumps(cpu_groups, ensure_ascii=True, sort_keys=True),
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_tests={'true' if cpu_groups else 'false'}\n")
              output.write(
                  "test_groups="
                  + json.dumps(cpu_groups, separators=(",", ":"))
                  + "\n"
              )
          PY

      - name: Post scope summary
        if: ${{ steps.cpu_scope.outputs.has_tests == 'true' }}
        env:
          TEST_GROUPS: ${{ steps.cpu_scope.outputs.test_groups }}
          MATCHED_MODULES: ${{ steps.scope.outputs.matched_modules }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os

          groups = json.loads(os.environ["TEST_GROUPS"])
          modules = os.environ["MATCHED_MODULES"]

          lines = ["## Smart UT Test Scope", ""]
          lines.append(f"**Matched modules:** {modules}")
          lines.append("")

          for group in groups:
              npu_type = group["npu_type"]
              num_npus = group["num_npus"]
              runner = group["runner"]
              tests = group["tests"].split()
              header = f"### {npu_type.upper()} x{num_npus} ({len(tests)} tests) -> `{runner}`"
              if npu_type == "cpu":
                  header = f"### CPU ({len(tests)} tests) -> `{runner}`"
              lines.append(header)
              lines.append("")
              lines.append("| # | Test target |")
              lines.append("|---|-------------|")
              for index, target in enumerate(tests, 1):
                  lines.append(f"| {index} | `{target}` |")
              lines.append("")

          print("\n".join(lines))
          PY

      - name: Post CPU-only notice when NPU groups were selected
        if: ${{ steps.scope.outputs.has_tests == 'true' && steps.cpu_scope.outputs.has_tests != 'true' }}
        run: |
          {
            echo "## Smart UT Test Scope"
            echo
            echo "No hosted CPU Smart UT targets matched this PR; NPU groups are handled by the external validator."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post no-test summary
        if: ${{ steps.scope.outputs.has_tests != 'true' }}
        env:
          MATCHED_MODULES: ${{ steps.scope.outputs.matched_modules || steps.noop.outputs.matched_modules }}
        run: |
          {
            echo "## Smart UT Test Scope"
            echo
            if [ "$MATCHED_MODULES" = "workflow-only" ]; then
              echo "Smart UT matrix skipped because no runtime or unit-test paths changed."
            else
              echo "No Smart UT targets matched this PR."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  smart-ut:
    name: smart unit test
    needs: [scope]
    if: ${{ needs.scope.outputs.has_tests == 'true' && !contains(needs.scope.outputs.matched_modules, 'kv_cache_compression') }}
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm: ${{ needs.scope.outputs.main_commit }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      test_groups: ${{ needs.scope.outputs.test_groups }}

  pyramidkv-smart-ut:
    name: PyramidKV paired-Core CPU tests
    needs: [scope]
    if: ${{ needs.scope.outputs.has_tests == 'true' && contains(needs.scope.outputs.matched_modules, 'kv_cache_compression') }}
    uses: ./.github/workflows/_selected_tests.yaml
    with:
      vllm_repository: vLLM-HUST/vllm-hust
      vllm: ${{ needs.scope.outputs.pyramidkv_core_commit }}
      ref: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.base_ref }}
      rebase_on_base: false
      test_groups: >-
        [{"num_npus":0,"npu_type":"cpu","runner":"ubuntu-latest","tests":"tests/ut/kv_cache_compression tests/ut/attention/test_attention_utils.py tests/ut/test_pyramidkv_ci_wiring.py tests/ut/test_build_metadata.py tests/ut/test_ci_boundary_static.py tests/ut/test_smart_ut_runtime_workflow_static.py","partition":"1-1","image_tag":"22.04","hosted_cpu":true}]

  paired-core-mypy:
    name: PyramidKV paired-Core mypy
    needs: [scope]
    if: ${{ contains(needs.scope.outputs.matched_modules, 'kv_cache_compression') }}
    runs-on: ubuntu-latest
    container:
      image: quay.io/ascend-ci/vllm-ascend:lint
    steps:
      - name: Checkout vllm-ascend-hust
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout paired vllm-hust
        uses: actions/checkout@v7
        with:
          repository: vLLM-HUST/vllm-hust
          ref: ${{ needs.scope.outputs.pyramidkv_core_commit }}
          path: vllm-empty

      - name: Run paired-Core mypy for PyramidKV changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin "${{ github.base_ref }}"
          mapfile -t changed_python_files < <(
            git diff --name-only --diff-filter=ACMRT \
              "origin/${{ github.base_ref }}...HEAD" -- \
              ':(glob)vllm_ascend/**/*.py'
          )
          if (( ${#changed_python_files[@]} == 0 )); then
            echo "No changed vllm_ascend Python files to type-check."
            exit 0
          fi
          printf 'Type-checking paired-Core files:\n'
          printf '  %s\n' "${changed_python_files[@]}"
          export PYTHONPATH="$PYTHONPATH:$(pwd)/vllm-empty"
          for python_version in 3.10 3.11 3.12; do
            mypy --follow-imports skip --check-untyped-defs \
              --python-version "$python_version" \
              "${changed_python_files[@]}"
          done

  validate-hust-dual-editable:
    name: PyramidKV dual-editable compatibility
    needs: [scope]
    if: ${{ contains(needs.scope.outputs.matched_modules, 'kv_cache_compression') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      UV_INDEX_URL: https://repo.huaweicloud.com/repository/pypi/simple
      UV_HTTP_TIMEOUT: 60
      UV_LINK_MODE: copy
      TORCH_DEVICE_BACKEND_AUTOLOAD: 0
    steps:
      - name: Checkout vllm-ascend-hust
        uses: actions/checkout@v7

      - name: Checkout paired vllm-hust
        uses: actions/checkout@v7
        with:
          repository: vLLM-HUST/vllm-hust
          ref: ${{ needs.scope.outputs.pyramidkv_core_commit }}
          path: vllm-hust

      - name: Create clean Python environment
        run: |
          python3 -m pip install uv
          uv venv --python 3.12 .venv-dual-editable

      - name: Install Ascend target runtime and core build dependencies
        run: |
          UV_EXTRA_INDEX_URL=https://mirrors.huaweicloud.com/ascend/repos/pypi \
          UV_INDEX_STRATEGY=unsafe-best-match \
            uv pip install \
            --python .venv-dual-editable/bin/python \
            -r ./vllm-hust/requirements/common.txt \
            -r ./requirements.txt \
            -r ./vllm-hust/requirements/build/empty.txt \
            --verbose

      - name: Install paired vllm-hust editable
        run: |
          VLLM_TARGET_DEVICE=empty uv pip install \
            --python .venv-dual-editable/bin/python \
            -e ./vllm-hust \
            --no-build-isolation \
            --no-deps \
            --verbose

      - name: Install vllm-ascend-hust editable
        run: |
          COMPILE_CUSTOM_KERNELS=0 \
          SOC_VERSION=ascend910b1 \
            uv pip install \
            --python .venv-dual-editable/bin/python \
            -e . \
            --no-deps \
            --verbose

      - name: Validate metadata and dependencies
        run: |
          .venv-dual-editable/bin/python -m pytest --noconftest \
            tests/ut/test_build_metadata.py \
            tests/ut/test_runtime_metadata.py \
            -q
          .venv-dual-editable/bin/python - <<'PY'
          import json
          from importlib.metadata import distribution
          from pathlib import Path
          from sysconfig import get_path

          for package in ("vllm", "vllm-ascend-hust"):
              dist = distribution(package)
              direct_url = dist.read_text("direct_url.json")
              if direct_url is not None:
                  assert json.loads(direct_url)["dir_info"]["editable"] is True, package
                  continue

              normalized_name = package.replace("-", "_")
              editable_paths = list(
                  Path(get_path("purelib")).glob(
                      f"__editable__.{normalized_name}-*.pth"
                  )
              )
              assert editable_paths, f"{package}: no editable-install metadata"
              assert all(path.is_file() for path in editable_paths)
          PY
          uv pip check --python .venv-dual-editable/bin/python
